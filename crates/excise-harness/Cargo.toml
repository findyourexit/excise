[package]
name = "excise-harness"
description = "Black-box validation harness for Excise: scenario model, fixture generator, and machine-output schemas"
version = "0.0.0"
publish = false
readme = "README.md"
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.21"
toml = "1.1.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
jsonschema = { version = "0.58.2", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true
