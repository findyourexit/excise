[package]
name = "excise-harness"
description = "Black-box validation harness for Excise: scenario model, fixture generator, and machine-output schemas"
version = "0.0.0"
publish = false
readme = "README.md"
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
jsonschema = { version = "0.58.2", default-features = false }
portable-pty = "0.9.0"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
shell-words = "1.1.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28.0", default-features = false, features = ["fs", "resource", "term", "time"] }
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[lints]
workspace = true
