[package]
name = "excise-harness"
description = "Black-box validation harness for Excise: scenario model and machine-output schemas"
version = "0.0.0"
publish = false
readme = "README.md"
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
jsonschema = { version = "0.58.2", default-features = false }

[lints]
workspace = true
