schema_version = 1

# Fixtures that are expected to FAIL the headless oracle diff, strictly (see the harness README,
# "Expected failures"). Each entry must fail with exactly the listed discrepancy kinds on the
# listed platforms: a different failure is a new defect, and no failure means the defect is fixed
# and the entry has to go.

[[expect_fail]]
fixture = "all-classes-small"
platforms = ["macos", "linux"]
findings = ["F11"]
kinds = ["missing", "summary"]
reason = "Its deep part: the scanner stats every entry by its full path, so nothing past PATH_MAX is scanned."

[[expect_fail]]
fixture = "deep-past-path-max"
platforms = ["macos", "linux"]
findings = ["F11"]
kinds = ["missing", "state", "summary"]
reason = "The scanner stats every entry by its full path (process_entry calls fs::symlink_metadata), so nothing past PATH_MAX is scanned: the report lists a fraction of the tree, calls it uncertain, and counts one unreadable folder, where the tree can be read to the bottom."

# Fixtures whose `headless_scan_ratio` is expected to miss the budget, strictly (see the harness
# README, "Expected failures"). Gated only where the fixture's oracle entry count (fixed by its
# spec and seed, never a measured time) is large enough; elsewhere the ratio is reported but never
# gated. A gated fixture over budget with no entry for this platform fails the run, exactly like an
# undocumented oracle-diff discrepancy. None is expected today: every gated fixture is within the
# budget on macOS and Linux. Windows has no `du` reference, so no ratio is ever measured there.
