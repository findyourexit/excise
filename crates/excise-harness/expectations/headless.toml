schema_version = 1

# Fixtures that are expected to FAIL the headless oracle diff, strictly (see the harness README,
# "Expected failures"). Each entry must fail with exactly the listed discrepancy kinds on the
# listed platforms: a different failure is a new defect, and no failure means the defect is fixed
# and the entry has to go.

[[expect_fail]]
fixture = "hostile-small"
platforms = ["macos", "linux"]
findings = ["F10"]
kinds = ["entry-state"]
reason = "A directory that cannot be listed, and every folder above it, is reported `complete` with exact bounds. Only the document state, the exit code, and the summary carry the uncertainty, against docs/safety/accounting.md: \"Parent folders retain a lower bound and show the uncertainty.\""

[[expect_fail]]
fixture = "all-classes-small"
platforms = ["macos", "linux"]
findings = ["F10", "F11"]
kinds = ["entry-state", "missing", "summary"]
reason = "F10 for its hostile part, and F11 for its deep part: the scanner stats every entry by its full path, so nothing past PATH_MAX is scanned."

[[expect_fail]]
fixture = "deep-past-path-max"
platforms = ["macos", "linux"]
findings = ["F11"]
kinds = ["missing", "state", "summary"]
reason = "The scanner stats every entry by its full path (process_entry calls fs::symlink_metadata), so nothing past PATH_MAX is scanned: the report lists a fraction of the tree, calls it uncertain, and counts one unreadable folder, where the tree can be read to the bottom."

# Fixtures whose `headless_scan_ratio` is expected to miss the budget today, strictly (see the
# harness README, "Expected failures"). Gated only where the fixture's oracle entry count (fixed
# by its spec and seed, never a measured time) is large enough; elsewhere the ratio is reported
# but never gated. A gated fixture over budget with no entry for this platform fails the run,
# exactly like an undocumented oracle-diff discrepancy. Measured on macOS and Linux (CI); Windows
# has no `du` reference, so no ratio is ever measured there and neither entry needs it.

[[expect_ratio_fail]]
fixture = "delete-folder"
platforms = ["macos", "linux"]
findings = ["F16"]
reason = "With the per-run durable syncs gone, this 5,011-entry fixture still runs far over the 3x budget: 196.5x `du` on macOS (183.4-201.9x across the measured pairs), and over 100x on Linux. The scan and admission now finish in a small fraction of that time; sampling a headless run shows the main thread spending the rest in `cli::write_scan_report` -> `ScanReport::write_json` -> `write_canonical_scan_report_json`'s pretty-printed serde_json serialization, almost entirely in `std::fs::File::write` (a raw `write()` syscall) reached through `Write::write_all`: the output file is a bare `File::create` with no `BufWriter`, so every PrettyFormatter token becomes its own syscall."

[[expect_ratio_fail]]
fixture = "node-modules-2k"
platforms = ["macos", "linux"]
findings = ["F16"]
reason = "The same post-publication report-building cost (not the now-removed durable syncs) dominates this deeply nested, many-small-files tree too: 88.6x `du` on macOS (87.6-90.6x), over 75x on Linux."

[[expect_ratio_fail]]
fixture = "node-modules-50k"
platforms = ["macos", "linux"]
findings = ["F16"]
reason = "The same post-publication cost, at a larger scale: 122.4x `du` on macOS (119.4-126.1x), over 95x on Linux."

[[expect_ratio_fail]]
fixture = "scan-store-quota"
platforms = ["macos", "linux"]
findings = ["F16"]
reason = "The same post-publication cost, on this 35,000-tiny-file volume fixture: 258.4x `du` on macOS (250.4-259.9x), over 105x on Linux."

[[expect_ratio_fail]]
fixture = "selection-drift"
platforms = ["macos", "linux"]
findings = ["F16"]
reason = "The same post-publication cost, on this fixture's 20,000-plus entries: 247.9x `du` on macOS (226.4-276.1x), over 120x on Linux."

[[expect_ratio_fail]]
fixture = "tiny-files-50k"
platforms = ["macos", "linux"]
findings = ["F16"]
reason = "The same post-publication cost, at 49,052 entries: 263.0x `du` on macOS (242.2-265.7x), over 120x on Linux."

[[expect_ratio_fail]]
fixture = "tiny-files-250k"
platforms = ["macos", "linux"]
findings = ["F16"]
reason = "The same post-publication cost at this scale too: 145.9x `du` on macOS (117.7-169.5x; only the first run's report is diffed, to bound the disk a fixture this size uses), about 126x on Linux (65.6 s for 249,252 entries)."
