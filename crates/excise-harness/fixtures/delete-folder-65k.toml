schema_version = 1
id = "delete-folder-65k"
description = "A folder to delete and the siblings that must survive, large enough that the plan of its deletion spills to temporary storage and that the history of the deletion is long. `victim/` holds 65,111 entries (111 directories, 65,000 files of 1 to 32 bytes): about 60 MB as the plan would hold it in memory, against the 32 MiB a plan may use at the default memory limit, so the plan spills and the history keeps the report of the deletion in temporary storage, where it stays exportable whatever the size of the folder. `keep-a.bin` and `keep-b/keep.txt` are the sentinels."
seed = 20261003

[[parts]]
kind = "file"
root = "keep-a.bin"
size = 4096

[[parts]]
kind = "tree"
root = "keep-b"
depth = 0
files_per_dir = 1
file_names = { style = "literal", name = "keep.txt" }
file_size = 64

[[parts]]
kind = "tree"
root = "victim"
depth = 2
fanout = 10
files_per_dir = 650
file_placement = "leaves"
dir_names = { style = "sequential", prefix = "part", width = 2 }
file_names = { style = "sequential", prefix = "t", suffix = ".dat", width = 4 }
file_size = { min = 1, max = 32 }
