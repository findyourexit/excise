schema_version = 1
id = "tiny-files-50k"
description = "About 50k tiny files: 49 directories of 1,000 files of 1 to 32 bytes. 49,050 entries counting the root directory. The per-PR-tier scale fixture."
seed = 50000

[[parts]]
kind = "tree"
root = "tiny"
depth = 1
fanout = 49
files_per_dir = 1000
file_placement = "leaves"
dir_names = { style = "sequential", prefix = "bucket", width = 2 }
file_names = { style = "sequential", prefix = "t", suffix = ".dat", width = 4 }
file_size = { min = 1, max = 32 }
