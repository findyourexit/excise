schema_version = 1
id = "tiny-files-10m"
description = "Ten million tiny files: 100 x 100 leaf directories of 1,000 files of 1 to 32 bytes. 10,010,101 entries counting the root directory. The weekly tier only: tests must never generate it, and a hosted runner needs a file system with ten million inodes for it (see the weekly workflow)."
seed = 10000000

[[parts]]
kind = "tree"
root = "tiny"
depth = 2
fanout = 100
files_per_dir = 1000
file_placement = "leaves"
dir_names = { style = "sequential", prefix = "g", width = 3 }
file_names = { style = "sequential", prefix = "t", suffix = ".dat", width = 4 }
file_size = { min = 1, max = 32 }
