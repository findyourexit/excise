schema_version = 1
name = "latency-under-deletion-load-deterministic"
description = "Under the deterministic profile (one scan thread), navigation keys sent while the 5,011-entry delete-folder victim is being removed meet the strict latency budgets on macOS and Linux: the post-deletion rebuild admits scan-store runs on the owner thread, so any admission that waits on the disk stalls input."
fixture = "delete-folder"
sentinels = ["keep-a.bin", "keep-b/keep.txt"]
profiles = ["deterministic"]
tier = "full"
platforms = ["linux", "macos"]

[terminal]
cols = 120
rows = 40

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

[[steps]]
step = "select"
name = "victim"
timeout_ms = 10000

# `wait_for = "started"` returns as soon as the dialog has closed, while the 5,011-entry deletion
# keeps running in the background: that is exactly where the keys below must land.
[[steps]]
step = "delete"
name = "victim"
kind = "folder"
wait_for = "started"
timeout_ms = 60000

[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "key"
key = "up"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 10000

# The deletion step returned before the deletion itself finished. The map lists the victim until
# the program replaces it, and a quit meanwhile cancels the replacement (exit code 130). The header
# reads COMPLETE from the map as it was, so it cannot say when that has happened; the program says
# so itself. This waits for the deletion's report, and then for that.
[[steps]]
step = "wait_fs_absent"
path = "victim"
timeout_ms = 30000

[[steps]]
step = "wait_refresh"
timeout_ms = 30000

[[steps]]
step = "expect_fs"
present = ["keep-a.bin", "keep-b/keep.txt"]
absent = ["victim"]

[[steps]]
step = "expect_budget"
budget = "first_frame_ms"
metric = "first_frame_ms"

[[steps]]
step = "expect_budget"
budget = "input_to_frame_p99_ms"
metric = "input_to_frame_p99_ms"

[[steps]]
step = "expect_budget"
budget = "max_stall_ms"
metric = "max_stall_ms"

[[steps]]
step = "quit"
timeout_ms = 10000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 15000

[[steps]]
step = "expect_budget"
budget = "quit_ms"
metric = "quit_ms"
