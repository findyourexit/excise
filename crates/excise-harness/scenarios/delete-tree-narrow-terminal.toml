schema_version = 1
name = "delete-tree-narrow-terminal"
description = "In a 60-column terminal, where the confirmation dialog is narrower, Enter still confirms the deletion of a folder, the whole tree goes, and the files beside it stay."
fixture = "nested"
sentinels = ["keep-a.bin", "keep-b.bin"]
profiles = ["default", "deterministic"]
# Not Windows: there the fixture lives under the runner's temporary directory, and the path the
# dialog shows (`\\?\D:\a\_temp\xh-…\nested-…\victim`, every backslash doubled) is longer than a
# 60-column dialog shows, so the `delete` step refuses to confirm a path it cannot read whole. The
# reduced-confirmation sibling, which has no dialog, runs there.
platforms = ["linux", "macos"]

# At 60 columns the confirmation dialog is 56 wide, against 78 at its widest, and shows at most 53
# characters of a path. The fixture id is short on purpose: the dialog cuts a longer path, and the
# `delete` step refuses a path it cannot read whole.
[terminal]
cols = 60
rows = 50

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

# Nothing is selected: the fresh map arms its cursor on `victim`, the largest entry. (At this width
# the status row can cut the filter prompt that `select` reads: on an elevated Windows session, as
# on the hosted runner, `! ELEVATED` takes the room. So the scenario does not use it.) The step reads
# the dialog, which must name `victim` directly below the root, and only then presses Enter.
[[steps]]
step = "delete"
name = "victim"
kind = "folder"
confirm_with = "enter"
timeout_ms = 60000

[[steps]]
step = "wait_fs_absent"
path = "victim"
timeout_ms = 30000

[[steps]]
step = "expect_fs"
present = ["keep-a.bin", "keep-b.bin"]
absent = ["victim", "victim/inner", "victim/inner/part-0.bin", "victim/part-0.bin"]

# What the interface reports afterwards: six entries deleted. This scenario never moves the cursor,
# so after the map refreshes the cursor lands on its largest entry again on every platform, and the
# selected-item panel shows the report in its own wording. (The header's status row cannot be used
# here: at 60 columns it is cut in the middle to fit beside the store's size, and how much of it is
# kept depends on the disk and, on Windows, on whether the session is elevated.) `skipped` would
# follow the count if any entry had not gone. The expect_fs step above shows every entry of the
# tree is gone. And no dialog is left.
[[steps]]
step = "wait_text"
text = "Last deletion: 6 removed"
timeout_ms = 30000

[[steps]]
step = "expect_screen"
not_contains = ["skipped", "DELETE FOLDER"]

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

[[steps]]
step = "quit"
timeout_ms = 10000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 15000
