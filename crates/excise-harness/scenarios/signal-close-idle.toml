schema_version = 1
name = "signal-close-idle"
description = "The Windows console close event delivered once the scan is idle (after COMPLETE) is a confirmed quit: it should remove session storage and exit 130, instead of leaving the process to the system's default handling with neither done (F6). The console is gone after the event, so the terminal itself cannot be checked."
fixture = "navigate-folders"
profiles = ["deterministic"]
tier = "full"
expect = "fail"
slice = "X3"
platforms = ["windows"]

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

[[steps]]
step = "signal"
signal = "close"

[[steps]]
step = "expect_exit"
code = 130
terminal_restored = true
residue = "none"
timeout_ms = 15000
