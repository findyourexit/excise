schema_version = 1
name = "memory-budget-interactive-250k"
description = "A 250k-entry interactive scan stays within the configured peak-memory budget (the peak_rss_bytes metric against the peak_rss_bytes budget, 512 MiB by default): the pull-request-tier size of the memory contract."
fixture = "tiny-files-250k"
profiles = ["default"]
tier = "full"
platforms = ["linux", "macos"]

[terminal]
cols = 120
rows = 40

[[steps]]
step = "wait_header"
state = "complete"
# F1 (a known, separate defect) makes every scan of a tree this size slow today: a per-run durable
# write dominates ingestion. Twenty minutes is about double the slowest comparable measurement this
# program has on record (F1: 556 s for 246k entries, headless); it leaves headroom for this
# fixture's shape and for load on a shared machine without the step timing out for a reason that has
# nothing to do with memory.
timeout_ms = 1200000

[[steps]]
step = "expect_budget"
budget = "peak_rss_bytes"
metric = "peak_rss_bytes"

[[steps]]
step = "quit"
timeout_ms = 15000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 15000
