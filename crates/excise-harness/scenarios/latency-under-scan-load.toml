schema_version = 1
name = "latency-under-scan-load"
description = "Navigation keys sent while a 50k-entry scan is in progress must still get a frame within the strict latency budgets, and the longest gap between frames, which ends at scan_complete, must stay within the stall budget. Merging and publishing the scan's data is the scan store thread's work, so the loop that reads keys and draws frames never waits for it; while the completed scan publishes, the header shows how far finishing the map has got and how long it has taken, so the screen keeps moving through the longest stage, and a gap between frames means the loop was held up."
fixture = "tiny-files-50k"
profiles = ["default", "deterministic", "reduced-motion"]
tier = "full"
platforms = ["linux", "macos"]

[terminal]
cols = 120
rows = 40

# The scan is still running: the header badge must read SCANNING, never COMPLETE, so this never
# passes by outrunning the scan.
[[steps]]
step = "wait_header"
state = "scanning"
timeout_ms = 10000

# Six keys, spread by their own settles, so at least one lands in whatever part of the scan is
# slow: `down` and `up` cancel out, so the final selection is unaffected.
[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "key"
key = "up"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "key"
key = "up"

[[steps]]
step = "settle"
timeout_ms = 10000

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 120000

[[steps]]
step = "expect_budget"
budget = "first_frame_ms"
metric = "first_frame_ms"

[[steps]]
step = "expect_budget"
budget = "input_to_frame_p99_ms"
metric = "input_to_frame_p99_ms"

[[steps]]
step = "expect_budget"
budget = "max_stall_ms"
metric = "max_stall_ms"

[[steps]]
step = "quit"
timeout_ms = 15000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 15000

# `quit_ms` is only known once `expect_exit` has observed the process actually exit.
[[steps]]
step = "expect_budget"
budget = "quit_ms"
metric = "quit_ms"
