schema_version = 1
name = "signal-term-mid-scan"
description = "SIGTERM delivered while the scan is still running is a confirmed quit: it cancels the scan, restores the terminal, removes session storage, and exits 130."
fixture = "node-modules-2k"
profiles = ["deterministic"]
tier = "full"
platforms = ["linux", "macos"]

# A fixture large enough that the scan is still running when the signal lands: the header badge
# must read SCANNING, never COMPLETE, so a step that outruns the scan never passes by accident.
[[steps]]
step = "wait_header"
state = "scanning"
timeout_ms = 10000

[[steps]]
step = "signal"
signal = "term"

[[steps]]
step = "expect_exit"
code = 130
terminal_restored = true
residue = "none"
timeout_ms = 15000
