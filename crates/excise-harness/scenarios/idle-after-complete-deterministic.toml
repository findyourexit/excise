schema_version = 1
name = "idle-after-complete-deterministic"
description = "Under deterministic (reduced motion), once the scan completes and settles, a quiet terminal with no input shows 0 bytes of output and at most 50 ms of CPU over a 5 s window that starts 3.2 s after the last state change. Unlike the default-motion sheen (F3), reduced motion has no loading animation, so this should already hold."
fixture = "delete-folder"
profiles = ["deterministic"]
tier = "full"
platforms = ["linux", "macos"]

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

[[steps]]
step = "settle"

[[steps]]
step = "idle"
after_ms = 3200
window_ms = 5000

[[steps]]
step = "expect_budget"
budget = "idle_output_bytes"
metric = "idle_output_bytes"

[[steps]]
step = "expect_budget"
budget = "idle_cpu_ms"
metric = "idle_cpu_ms"
