schema_version = 1
name = "resource-budget-large-fds"
description = "Open descriptors do not grow with the size of the scanned tree. On this 49k-entry tree, in 49 folders, they stay within the baseline measured on a flat 1k-entry tree."
fixture = "tiny-files-50k"
profiles = ["deterministic"]
tier = "full"
platforms = ["linux", "macos"]

[terminal]
cols = 120
rows = 40

[budgets]
fds = 48

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 60000

[[steps]]
step = "expect_budget"
budget = "fds"
metric = "fds"

[[steps]]
step = "quit"
timeout_ms = 10000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 15000
