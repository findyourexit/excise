schema_version = 1
name = "latency-under-slow-terminal"
description = "Input must stay responsive while scanning, however fast the terminal drains. Capping the pseudo-terminal's drain at 150000 bytes/sec simulates a slow terminal. Frame output is paced to what the terminal can absorb, so terminal writes no longer block scan ingestion or input handling. The strict input p99 still fails: scan-store work on the owner thread (the per-batch durable syncs and the publication of the completed scan) stalls it for 50-170 ms during the scan's opening, even unthrottled, and disabling the syncs alone made 5 of 10 runs pass. Fixed when that work leaves the owner thread."
fixture = "node-modules-2k"
profiles = ["default", "deterministic"]
tier = "full"
platforms = ["linux", "macos"]
expect = "fail"
slice = "X8"

[terminal]
cols = 120
rows = 40
drain_bytes_per_sec = 150000

# The scan is still running: the header badge must read SCANNING, never COMPLETE, so this never
# passes by outrunning the scan.
[[steps]]
step = "wait_header"
state = "scanning"
timeout_ms = 10000

# `down` and `up` cancel out, so the final selection is unaffected. The settle timeout stays
# generous: a settle step is exactly where terminal backpressure would show up if input and
# rendering ever shared a blocking write again, so it has room to catch a regression rather than
# just passing trivially fast.
[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 30000

[[steps]]
step = "key"
key = "down"

[[steps]]
step = "settle"
timeout_ms = 30000

[[steps]]
step = "key"
key = "up"

[[steps]]
step = "settle"
timeout_ms = 30000

# Checked before the scan is awaited to completion, so the real number is always reported even if
# a future regression again let a throttled terminal delay COMPLETE under default motion.
[[steps]]
step = "expect_budget"
budget = "input_to_frame_p99_ms"
metric = "input_to_frame_p99_ms"

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 90000

[[steps]]
step = "expect_budget"
budget = "first_frame_ms"
metric = "first_frame_ms"

[[steps]]
step = "expect_budget"
budget = "max_stall_ms"
metric = "max_stall_ms"

[[steps]]
step = "quit"
timeout_ms = 15000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 15000

[[steps]]
step = "expect_budget"
budget = "quit_ms"
metric = "quit_ms"
