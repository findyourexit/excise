schema_version = 1
name = "memory-budget-interactive-1m"
description = "A 1,000,000-entry interactive scan stays within the configured peak-memory budget (the peak_rss_bytes metric against the peak_rss_bytes budget, 512 MiB by default), measured as the peak physical footprint on macOS and the peak resident set size on Linux: the nightly-tier size of the memory contract."
fixture = "tiny-files-1m"
profiles = ["default"]
tier = "nightly"
platforms = ["linux", "macos"]

[terminal]
cols = 120
rows = 40

[[steps]]
step = "wait_header"
state = "complete"
# Thirty minutes is this program's own ceiling for a single run of this fixture (it also bounds the
# headless scan of the same fixture). F1 (a known, separate defect) makes every scan slow today;
# this bound only has to fail a genuinely stuck run, not a slow one.
timeout_ms = 1800000

[[steps]]
step = "expect_budget"
budget = "peak_rss_bytes"
metric = "peak_rss_bytes"

[[steps]]
step = "quit"
timeout_ms = 30000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 30000
