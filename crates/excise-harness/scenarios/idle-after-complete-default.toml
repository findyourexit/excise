schema_version = 1
name = "idle-after-complete-default"
description = "Under default motion, once the scan completes and settles, a quiet terminal with no input shows 0 bytes of output and at most 50 ms of CPU over a 5 s window that starts 3.2 s after the last state change (one sheen cycle). The sheen plays one more cycle after the last input or state change and then settles instead of animating indefinitely (F3)."
fixture = "delete-folder"
profiles = ["default"]
tier = "full"
platforms = ["linux", "macos"]

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

[[steps]]
step = "settle"

[[steps]]
step = "idle"
after_ms = 3200
window_ms = 5000

[[steps]]
step = "expect_budget"
budget = "idle_output_bytes"
metric = "idle_output_bytes"

[[steps]]
step = "expect_budget"
budget = "idle_cpu_ms"
metric = "idle_cpu_ms"
