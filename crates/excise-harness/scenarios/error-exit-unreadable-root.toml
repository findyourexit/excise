schema_version = 1
name = "error-exit-unreadable-root"
description = "A root containing files and directories excise cannot read still reaches an exit code that reflects the uncertainty, restores the terminal, and leaves no residue, after an ordinary quit."
fixture = "hostile-small"
profiles = ["default", "deterministic"]
tier = "quick"
platforms = ["linux", "macos"]

[terminal]
cols = 120
rows = 40

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

[[steps]]
step = "quit"
timeout_ms = 10000

[[steps]]
step = "expect_exit"
code = 2
terminal_restored = true
residue = "none"
timeout_ms = 15000
