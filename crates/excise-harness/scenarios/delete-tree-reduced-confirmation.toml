schema_version = 1
name = "delete-tree-reduced-confirmation"
description = "With the confirmation disabled (--disable-delete-confirmation), Backspace deletes the selected folder at once with no dialog: the whole tree goes, nested folders included, the files beside it stay, and the program reports what it removed."
fixture = "nested"
sentinels = ["keep-a.bin", "keep-b.bin"]
disable_delete_confirmation = true
profiles = ["default", "deterministic"]

# 160 columns, so that the header's status row is never cut: it holds the reduced-guard label, the
# deletion report, and the store's size, and on an elevated Windows session (as on the hosted
# runner) `! ELEVATED` before them, about 131 characters in all. At 120 the program cuts the row in
# the middle, and the report with it.
[terminal]
cols = 160
rows = 40

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

# The mode is on and says so. The label is waited for: the header is drawn a row at a time.
[[steps]]
step = "wait_text"
text = "REDUCED DELETE GUARD"
region = "header"

[[steps]]
step = "select"
name = "victim"

# No dialog: the step checks the selected-item panel (this folder, a folder), the disk, and the
# sentinels, presses Backspace, and fails if a dialog opens.
[[steps]]
step = "delete"
name = "victim"
kind = "folder"
timeout_ms = 60000

[[steps]]
step = "wait_fs_absent"
path = "victim"
timeout_ms = 30000

[[steps]]
step = "expect_fs"
present = ["keep-a.bin", "keep-b.bin"]
absent = ["victim", "victim/inner", "victim/inner/part-0.bin", "victim/part-0.bin"]

# What the interface reports afterwards: six entries deleted, and none failed, changed, missing, or
# left unattempted. The header's status row says so whether or not an entry is selected; the
# selected-item panel's shorter wording needs a selection, which the map does not keep on every
# platform. And no dialog opened or is left.
[[steps]]
step = "wait_text"
text = "Last deletion: 6 deleted · 0 changed · 0 missing · 0 failed · 0 not run"
region = "header"
timeout_ms = 30000

[[steps]]
step = "expect_screen"
not_contains = ["DELETE FOLDER"]

[[steps]]
step = "wait_header"
state = "complete"
timeout_ms = 30000

[[steps]]
step = "quit"
timeout_ms = 10000

[[steps]]
step = "expect_exit"
code = 0
terminal_restored = true
residue = "none"
timeout_ms = 15000
