[project]
site_name = "Excise"
site_url = "https://tomlarcher.com/excise/"
site_description = "Surgical terminal storage navigator"
repo_url = "https://github.com/findyourexit/excise"
repo_name = "findyourexit/excise"
edit_uri = "edit/main/docs/"

copyright = "Copyright &copy; 2026 Tom Larcher"

nav = [
  { "Home" = "index.md" },
  { "Use Excise" = [
    { "Getting Started" = "getting-started.md" },
    { "Configuration" = "configuration.md" },
    { "Reports & JSON Formats" = "reports.md" },
  ]},
  { "Understand the System" = [
    { "Architecture" = "architecture/overview.md" },
    { "Background Task System" = "architecture/background-tasks.md" },
    { "Threat Model" = "architecture/threat-model.md" },
  ]},
  { "Safety Contracts" = [
    { "Permanent Deletion" = "safety/deletion.md" },
    { "Space Accounting" = "safety/accounting.md" },
  ]},
  { "Contribute & Maintain" = [
    { "Development" = "development.md" },
    { "Release Process" = "releasing.md" },
    { "Project Lineage" = "lineage.md" },
  ]},
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/findyourexit/excise"

[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/excise"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
