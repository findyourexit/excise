[workspace]
members = ["xtask"]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "excise"
description = "Surgical terminal storage navigator"
keywords = ["disk-usage", "filesystem", "terminal", "tui"]
categories = ["command-line-utilities", "filesystem"]

version = "1.2.1"
authors = ["Aram Drevekenin <aram@poor.dev>", "Tom Larcher <tom.larcher@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/findyourexit/excise"
repository = "https://github.com/findyourexit/excise"
license = "MIT"
edition = "2024"
rust-version = "1.88"
exclude = [
    ".cargo",
    ".github",
    ".gitmessage",
    "assets",
    "tapes",
    "handoff",
    "packaging",
]


[features]
fuzzing = []
internal = []

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tar.gz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.zip"
pkg-fmt = "zip"
[[bin]]
name = "excise"
path = "src/main.rs"

[[bench]]
name = "tachyonfx"
harness = false
required-features = ["internal"]

[[bench]]
name = "core"
harness = false
required-features = ["internal"]
[dependencies]

ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "std"] }
crossterm = "0.29"
anyhow = "1"
cap-primitives = "4.0.2"
clap = { version = "4.6", features = ["derive"] }
filesize = "0.2.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
crossbeam-channel = "0.5.16"
directories = "6.0.0"
file-id = { version = "0.2.3", features = ["serde"] }
globset = "0.4.20"
getrandom = "0.3.4"
ignore = "0.4.33"
redb = "2.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tachyonfx = { version = "0.25.1", default-features = false, features = ["std"] }
thiserror = "2.0.20"
toml = "1.1.4"
sysinfo = { version = "0.35.2", default-features = false, features = ["disk", "system"] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["user", "signal"] }
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
insta = "1.48.0"
portable-pty = "0.9.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
jsonschema = { version = "0.49.9", default-features = false }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
unwrap_used = "deny"

