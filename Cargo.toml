[package]
name = "excise"
description = "Surgical terminal storage navigator"
version = "0.0.0-dev"
authors = ["Aram Drevekenin <aram@poor.dev>", "Tom Larcher <tom.larcher@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/findyourexit/excise"
repository = "https://github.com/findyourexit/excise"
license = "MIT"
edition = "2018"
publish = false

[[bin]]
name = "excise"
path = "src/main.rs"

[dependencies]
ratatui = {version="0.29", default-features = false, features = ['crossterm'] }
crossterm = "0.29"
failure = "0.1"
jwalk = "0.8"
structopt = "0.3"
filesize = "0.2.0"
unicode-width = "0.2.0"
nix = { version = "0.30.1", features = ["user"] }
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["securitybaseapi","debugapi"] }

[dev-dependencies]
insta = "1.43.1"

