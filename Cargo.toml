[workspace]
members = ["xtask"]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "excise"
description = "Surgical terminal storage navigator"
version = "0.0.0-dev"
authors = ["Aram Drevekenin <aram@poor.dev>", "Tom Larcher <tom.larcher@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/findyourexit/excise"
repository = "https://github.com/findyourexit/excise"
license = "MIT"
edition = "2024"
rust-version = "1.88"
exclude = [".cargo", ".github", "docs/design/recordings", "prototypes", "demo.gif"]
publish = false

[[bin]]
name = "excise"
path = "src/main.rs"

[[bench]]
name = "tachyonfx"
harness = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "std"] }
crossterm = "0.29"
anyhow = "1"
jwalk = "0.8"
clap = { version = "4.6", features = ["derive"] }
filesize = "0.2.0"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["user"] }

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1.2"

[dev-dependencies]
insta = "1.48.0"
portable-pty = "0.9.0"
tempfile = "3.27.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tachyonfx = { version = "0.25.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
unwrap_used = "deny"

