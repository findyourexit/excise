name: Demo recording

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Render the README hero, feature demos, or both
        required: false
        default: hero
        type: choice
        options:
          - hero
          - features
          - all

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Rendering is intentionally read-only: the generated GIF is uploaded as an
# artifact and is never committed or pushed by this workflow.
jobs:
  record:
    name: Render VHS demos
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DEMO_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'hero' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0

      - name: Build release binary
        run: cargo build --package excise --release --locked

      - name: Install pinned VHS toolchain
        shell: bash
        env:
          VHS_VERSION: 0.11.0
          VHS_SHA256: 99cb634587eaae0473c1ea377db80c3a048c27f99fe0a7febb1a1e8cb7ee5009
          TTYD_VERSION: 1.7.7
          TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
        run: |
          set -euo pipefail
          sudo apt-get update --yes
          sudo apt-get install --yes ffmpeg gifsicle fonts-jetbrains-mono

          bin_dir="$RUNNER_TEMP/vhs-bin"
          mkdir -p "$bin_dir"

          vhs_archive="$RUNNER_TEMP/vhs.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$vhs_archive" \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$VHS_SHA256" "$vhs_archive" | sha256sum --check
          tar --extract --gzip --file "$vhs_archive" --directory "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/vhs_${VHS_VERSION}_Linux_x86_64/vhs" \
            "$bin_dir/vhs"

          ttyd_binary="$RUNNER_TEMP/ttyd.x86_64"
          curl --fail --location --silent --show-error \
            --output "$ttyd_binary" \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          printf '%s  %s\n' "$TTYD_SHA256" "$ttyd_binary" | sha256sum --check
          install -m 0755 "$ttyd_binary" "$bin_dir/ttyd"

          echo "$bin_dir" >> "$GITHUB_PATH"
          printf 'CI=\nCOLORTERM=truecolor\n' >> "$GITHUB_ENV"
          fc-cache --force
      - name: Render demo GIFs
        shell: bash
        run: |
          set -euo pipefail
          case "$DEMO_MODE" in
            hero) cargo demo ;;
            features) cargo demo-features ;;
            all)
              cargo demo
              cargo demo-features
              ;;
            *) echo "unknown demo mode: $DEMO_MODE" >&2; exit 64 ;;
          esac

      - name: Verify generated media
        shell: bash
        run: |
          set -euo pipefail
          case "$DEMO_MODE" in
            hero) test -s assets/demo-main.gif ;;
            features)
              shopt -s nullglob
              feature_gifs=(assets/features/*.gif)
              test "${#feature_gifs[@]}" -eq 8
              for gif in "${feature_gifs[@]}"; do test -s "$gif"; done
              ;;
            all)
              test -s assets/demo-main.gif
              shopt -s nullglob
              feature_gifs=(assets/features/*.gif)
              test "${#feature_gifs[@]}" -eq 8
              for gif in "${feature_gifs[@]}"; do test -s "$gif"; done
              ;;
          esac
      - name: Stage selected demo media
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/excise-demo"
          rm -rf -- "$artifact_dir"
          mkdir -p "$artifact_dir"
          case "$DEMO_MODE" in
            hero)
              cp -- assets/demo-main.gif "$artifact_dir/"
              ;;
            features)
              mkdir -p "$artifact_dir/features"
              cp -- assets/features/*.gif "$artifact_dir/features/"
              ;;
            all)
              cp -- assets/demo-main.gif "$artifact_dir/"
              mkdir -p "$artifact_dir/features"
              cp -- assets/features/*.gif "$artifact_dir/features/"
              ;;
            *) echo "unknown demo mode: $DEMO_MODE" >&2; exit 64 ;;
          esac

      - name: Upload demo artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excise-demo-${{ github.sha }}-${{ env.DEMO_MODE }}
          path: ${{ runner.temp }}/excise-demo
          if-no-files-found: error
          retention-days: 7
