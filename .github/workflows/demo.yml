name: Demo recording

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Rendering is intentionally read-only: the generated GIF is uploaded as an
# artifact and is never committed or pushed by this workflow.
jobs:
  record:
    name: Render VHS hero tape
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0

      - name: Build release binary
        run: cargo build --package excise --release --locked

      - name: Install pinned VHS toolchain
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.11.0

      - name: Validate VHS tape syntax
        run: vhs validate tapes/demo.tape

      - name: Render demo GIF
        run: vhs tapes/demo.tape

      - name: Verify generated media
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/demo.gif

      - name: Upload demo artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: excise-demo-${{ github.sha }}
          path: assets/demo.gif
          if-no-files-found: error
          retention-days: 7
