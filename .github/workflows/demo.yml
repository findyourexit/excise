name: Demo recording

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Rendering is intentionally read-only: the generated GIF is uploaded as an
# artifact and is never committed or pushed by this workflow.
jobs:
  record:
    name: Render VHS hero tape
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0

      - name: Build release binary
        run: cargo build --package excise --release --locked

      - name: Install pinned VHS toolchain
        shell: bash
        env:
          VHS_VERSION: 0.11.0
          VHS_SHA256: 99cb634587eaae0473c1ea377db80c3a048c27f99fe0a7febb1a1e8cb7ee5009
          TTYD_VERSION: 1.7.7
          TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
        run: |
          set -euo pipefail
          sudo apt-get update --yes
          sudo apt-get install --yes ffmpeg gifsicle fonts-jetbrains-mono

          bin_dir="$RUNNER_TEMP/vhs-bin"
          mkdir -p "$bin_dir"

          vhs_archive="$RUNNER_TEMP/vhs.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$vhs_archive" \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$VHS_SHA256" "$vhs_archive" | sha256sum --check
          tar --extract --gzip --file "$vhs_archive" --directory "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/vhs_${VHS_VERSION}_Linux_x86_64/vhs" \
            "$bin_dir/vhs"

          ttyd_binary="$RUNNER_TEMP/ttyd.x86_64"
          curl --fail --location --silent --show-error \
            --output "$ttyd_binary" \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          printf '%s  %s\n' "$TTYD_SHA256" "$ttyd_binary" | sha256sum --check
          install -m 0755 "$ttyd_binary" "$bin_dir/ttyd"

          echo "$bin_dir" >> "$GITHUB_PATH"
          printf 'CI=\nCOLORTERM=truecolor\n' >> "$GITHUB_ENV"
          fc-cache --force
      - name: Render demo GIF
        run: cargo demo

      - name: Verify generated media
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/demo-main.gif

      - name: Upload demo artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: excise-demo-${{ github.sha }}
          path: assets/demo-main.gif
          if-no-files-found: error
          retention-days: 7
