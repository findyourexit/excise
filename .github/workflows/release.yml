name: Release candidate artifacts

on:
  workflow_dispatch:
    inputs:
      attest:
        description: Generate GitHub build attestations for the dry-run artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archive:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-2025, target: aarch64-pc-windows-msvc }
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update --yes && sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Install pinned Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add "$TARGET" --toolchain 1.88.0
          rustup override set 1.88.0
      - name: Build locked release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          fi
          cargo build --target "$TARGET" --locked --release --package excise
      - name: Strip Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip "target/$TARGET/release/excise"
          else
            strip "target/$TARGET/release/excise"
          fi
      - name: Validate distribution template contracts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: cargo run --locked --package xtask -- check-distribution
      - name: Assemble Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | sed -n '1p')"
          root="excise-${TARGET}-v${version}"
          mkdir -p "stage/${root}/generated" "stage/${root}/schemas"
          cp "target/${TARGET}/release/excise" "stage/${root}/excise"
          cp LICENSE README.md "stage/${root}/"
          cp -R generated/. "stage/${root}/generated/"
          cp docs/schemas/*.json "stage/${root}/schemas/"
          tar -C stage -czf "${root}.tar.gz" "${root}"
          mkdir upload
          mv "${root}.tar.gz" upload/
      - name: Assemble Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]*)"').Matches[0].Groups[1].Value
          $root = "excise-$env:TARGET-v$version"
          New-Item -ItemType Directory -Force "stage/$root/generated", "stage/$root/schemas", upload | Out-Null
          Copy-Item "target/$env:TARGET/release/excise.exe" "stage/$root/excise.exe"
          Copy-Item LICENSE, README.md "stage/$root/"
          Copy-Item -Recurse generated/* "stage/$root/generated/"
          Copy-Item docs/schemas/*.json "stage/$root/schemas/"
          Compress-Archive -Path "stage/$root" -DestinationPath "upload/$root.zip"
      - name: Upload immutable target archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: excise-${{ matrix.target }}
          path: upload/*
          if-no-files-found: error
          retention-days: 1

  supply-chain:
    name: Checksums, SBOM, and optional provenance
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source for dependency SBOM
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Prepare Cargo dependency source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom-source/xtask
          cp source/Cargo.toml source/Cargo.lock sbom-source/
          cp source/xtask/Cargo.toml sbom-source/xtask/
      - name: Download target archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v8
        with:
          pattern: excise-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum ./excise-* > checksums.sha256
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sbom-source
          format: spdx-json
          output-file: release/excise.spdx.json
          upload-artifact: false
      - name: Validate dependency SBOM coverage
        shell: bash
        run: |
          set -euo pipefail
          sbom=release/excise.spdx.json
          test "$(jq '.packages | length' "$sbom")" -gt 1
          jq -e '.packages[] | select(.name == "excise")' "$sbom" >/dev/null
          jq -e '.packages[] | select(.name == "serde")' "$sbom" >/dev/null
      - name: Attest dry-run artifacts
        if: inputs.attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Upload release candidate bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: excise-release-candidate
          path: release
          if-no-files-found: error
          retention-days: 1
