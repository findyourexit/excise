name: Native verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned MSRV
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.88.0
          rustc --version --verbose
      - name: Install dependency policy tool
        shell: bash
        run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check generated artifacts and published schema contracts
        if: runner.os == 'Linux'
        run: cargo run --locked --package xtask -- check-generated
      - name: Check every target
        run: cargo check --workspace --all-targets --locked
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit, snapshot, and native PTY tests
        run: cargo test --workspace --locked
      - name: Run release-profile PTY checks
        shell: bash
        run: |
          cargo build --release --package excise --locked
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="$(pwd -W)/target/release/excise.exe"
          else
            binary="$PWD/target/release/excise"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXCISE_PTY_BINARY="$binary" cargo test --test pty_smoke --locked
          else
            EXCISE_PTY_BUDGETS=1 EXCISE_PTY_BINARY="$binary" cargo test --test pty_smoke --locked
          fi
      - name: Verify package contents and build
        run: cargo package --package excise --locked
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  nix:
    name: Nix flake package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      - name: Build locked flake
        run: nix build --no-update-lock-file --print-build-logs

  policy:
    name: Workflow and dependency policy syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Validate Renovate syntax
        run: npx --yes --package renovate@44.34.0 renovate-config-validator .github/renovate.json5
      - name: Validate documentation links
        run: |
          cargo +stable install lychee --version 0.24.2 --locked
          lychee --offline --no-progress README.md CONTRIBUTING.md GOVERNANCE.md MAINTAINERS.md SECURITY.md SUPPORT.md docs
