name: Hosted benchmark

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "benches/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tachyonfx:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out source at release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact release checkout
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          printf 'Release SHA: %s\n' "$RELEASE_SHA"
      - name: Install minimum supported Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
      - name: Run statistical render benchmark
        run: cargo bench --bench tachyonfx --features internal --locked -- --noplot
      - name: Run statistical core benchmark
        run: cargo bench --bench core --features internal --locked -- --noplot
      - name: Record reproducible benchmark context
        shell: bash
        run: |
          {
            printf 'source_sha=%s\n' "$RELEASE_SHA"
            printf 'checked_out_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf '\ncommands:\n'
            printf '%s\n' \
              'cargo bench --bench tachyonfx --features internal --locked -- --noplot' \
              'cargo bench --bench core --features internal --locked -- --noplot'
            printf '\nrequested_toolchain=1.98.0\n'
            printf '\ntoolchain:\n'
            rustup show active-toolchain
            rustc -Vv
            cargo -V
            printf '\ncargo_lock_sha256:\n'
            sha256sum Cargo.lock
            printf '\nsystem:\n'
            uname -a
            lscpu
          } > target/criterion/benchmark-context.txt
      - name: Preserve benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-benchmark-evidence
          path: target/criterion
          if-no-files-found: error
          retention-days: 90
