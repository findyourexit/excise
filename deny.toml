[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = [
  { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
  # libproc reads the peak physical footprint on macOS. Its build script needs bindgen, which needs libloading.
  { allow = ["BSD-3-Clause"], crate = "bindgen@0.72.1" },
  { allow = ["ISC"], crate = "libloading@0.8.9" },
  # The headless runner validates scan reports with jsonschema. Its URI resolver depends on borrow-or-share.
  { allow = ["MIT-0"], crate = "borrow-or-share@0.2.4" },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The harness is a path-only dev-dependency of excise. Cargo strips it from the packaged manifest.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
  { crate = "failure", reason = "unmaintained error stack. Use anyhow or typed errors." },
  { crate = "structopt", reason = "superseded by Clap derive" },
  { crate = "tui", reason = "renamed and superseded by Ratatui" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
