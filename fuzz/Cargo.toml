[package]
name = "excise-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
excise = { path = ".." }
crossterm = "0.29"
file-id = "0.2.3"
libfuzzer-sys = "0.4.13"
serde_json = "1"
unicode-width = "0.2.2"
tempfile = "3.27.0"
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }

[[bin]]
name = "truncate"
path = "fuzz_targets/truncate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tachyonfx"
path = "fuzz_targets/tachyonfx.rs"
test = false
doc = false
bench = false

